name: Orihost 自动续期

on:
  schedule:
    - cron: "0 1 */3 * *"   # 每 3 天 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

env:
  SING_BOX_VERSION: "1.14.1"

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # 保活空提交用
      actions: write    # 清理旧运行记录
    steps:
      - uses: actions/checkout@v4
      - name: Load shared env (env-config)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
      - name: Apply shared env
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
          fi
          rm -rf .shared-env

      - name: 启动代理（Node_Proxy）
        id: proxy
        continue-on-error: true
        uses: gxjxzhoo/Node_Proxy@main
        with:
          node-link: ${{ env.NODE_LINK || secrets.NODE_LINK }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 缓存 sing-box
        id: sb-cache
        uses: actions/cache@v4
        with:
          path: ~/sing-box-bin
          key: sing-box-${{ env.SING_BOX_VERSION }}

      - name: 下载 sing-box
        if: steps.sb-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/sing-box-bin
          curl -fsSL --retry 3 -o /tmp/sb.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          mv /tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box ~/sing-box-bin/sing-box
          chmod +x ~/sing-box-bin/sing-box
        continue-on-error: true

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y xvfb   # SeleniumBase xvfb=True + uc_gui_click_captcha 需要

      - name: 续期
        env:
          ORIHOST_EMAIL: ${{ secrets.ORIHOST_EMAIL }}
          ORIHOST_PASSWORD: ${{ secrets.ORIHOST_PASSWORD }}
          ORIHOST_COOKIE: ${{ secrets.ORIHOST_COOKIE }}
          NODE_LINK: ${{ env.NODE_LINK || secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          SING_BOX_BIN: ~/sing-box-bin/sing-box
          NODE_PROXY_IP: ${{ steps.proxy.outputs.exit-ip }}
        run: |
          set -o pipefail
          python orihost_renew.py 2>&1 | tee raw.log

      - name: 回写 ORIHOST_COOKIE
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "未设置 GH_PAT，跳过 cookie 回写"; exit 0; fi
          if [ ! -s cookie.txt ]; then echo "没有导出的 cookie，跳过"; exit 0; fi
          gh secret set ORIHOST_COOKIE --repo "$GITHUB_REPOSITORY" < cookie.txt && echo "ORIHOST_COOKIE 已更新"
          rm -f cookie.txt

      - name: 保活（超过 45 天无提交补空提交）
        if: always()
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive" && git push || true
          fi

      - name: 日志推到 run-logs 分支（方便远程排查）
        if: always()
        run: |
          [ -f raw.log ] || exit 0
          grep -v '::add-mask::' raw.log > run.log || true
          rm -f raw.log
          mkdir -p /tmp/rl && cp run.log /tmp/rl/ && cp fail_*.png /tmp/rl/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} $(date -u +%FT%TZ)" > /tmp/rl/RUN.txt
          cd /tmp/rl && git init -q -b run-logs && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "logs ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" run-logs || true

      - name: 失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renew-fail
          path: fail_*.png
          if-no-files-found: ignore

      - name: 清理旧运行记录（保留最近 10 条）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' \
            | grep -v "^${GITHUB_RUN_ID}$" | tail -n +"$KEEP" \
            | while read -r id; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null && echo "已删除运行 ${id}"
              done || true
